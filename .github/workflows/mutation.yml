name: mutation

# StrykerJS でミュータントを作り、テストが見逃したものが増えていないかを確かめる。
# 設定は stryker.config.mjs、合否は scripts/check-mutation.mjs にある。
#
# - 版: @stryker-mutator/core・vitest-runner 10.1.1（package.json で固定）、pnpm 12.23.0、Node 24
# - 対象: src/ の 2 ファイル全体（popup.tsx・contents/hatena-bookmark-count.tsx）
# - 差分実行・incremental は使わない。全件でも 72 件・手元 約 40 秒と安く、incremental は
#   変異対象とテスト以外の変更（依存の更新など）を検出しない（Stryker 公式ドキュメント）
# - 実測（2026-11-27、導入時）: 生成 72 件（うち等価として除外 1 件）、Killed 43・Survived 7・
#   NoCoverage 21、スコア 60.56%。3 回の全件実行で同じ結果
# - 実測（2026-11-27、穴埋め後）: 生成 72 件（うち等価として除外 1 件）、Killed 71・Survived 0・
#   NoCoverage 0、スコア 100%。手元の Stryker 54〜55 秒。3 回の全件実行で同じ結果
# - ゲート: 見逃し（Survived + NoCoverage）の上限を実測 0 に置くラチェット（28 → 0）。等価は
#   除外済みのため余裕は持たせない。新しい等価ミュータントは上限ではなく除外コメントで扱う
# - 終了コード 0 だけでは空振り（変異対象 0 件）を見分けられないので、チェックスクリプトは
#   試されたミュータントが 1 件以上あることも確かめる
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Mutation testing
        run: pnpm test:mutation

      - name: Check undetected mutants
        run: node scripts/check-mutation.mjs

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
