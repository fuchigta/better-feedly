# cccc (https://github.com/moznion/cccc) の設定
# 関数ごとの複雑度がこの閾値を超えると cccc は非ゼロで終了し、CI が失敗する。
#
# 導入時（PR #2）は一般的に用いられる標準的な値（max-cognitive = 15 / max-cyclomatic = 10）を採用していた。
# 導入時点の実測値（3ファイル・13関数）は認知的複雑度 max 4、循環的複雑度 max 5
# （いずれも src/contents/hatena-bookmark-count.tsx の getInlineAnchorList）であり、
# 閾値に対して十分な余裕があった。
#
# 2026-11-28 の再計測（cccc 1.8.6、リポジトリルートで path: . を対象、13ファイル・76関数）でも
# 関数単位の実測最大値は認知的複雑度 4、循環的複雑度 5（いずれも getInlineAnchorList）で変わらず。
# 標準値のままでは余裕が大きすぎて劣化を検知できないため、実測最大値 +2 の
# max-cognitive = 6 / max-cyclomatic = 7 に引き下げた。
# 閾値は関数単位で判定される。scripts/check-mutation.mjs はファイル合計が 9 / 9 だが、
# これはトップレベルのコードによるもので、関数単位の判定には含まれない。
max-cognitive = 6
max-cyclomatic = 7
